[package]
name = "dc-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dc-format = { path = "../crates/dc-format" }
dc-crypto = { path = "../crates/dc-crypto" }

[[bin]]
name = "header_parse"
path = "fuzz_targets/header_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "header_payload"
path = "fuzz_targets/header_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sector_xts"
path = "fuzz_targets/sector_xts.rs"
test = false
doc = false
bench = false
