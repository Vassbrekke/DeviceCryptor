[workspace]
resolver = "2"
members = [
    "crates/dc-crypto",
    "crates/dc-format",
    "crates/dc-volume",
    "crates/dc-platform",
    "crates/dc-cli",
    "crates/dc-gui",
]
default-members = [
    "crates/dc-crypto",
    "crates/dc-format",
    "crates/dc-volume",
    "crates/dc-platform",
    "crates/dc-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Vassbrekke/DeviceCryptor"
rust-version = "1.85"

[workspace.dependencies]
dc-crypto = { path = "crates/dc-crypto" }
dc-format = { path = "crates/dc-format" }
dc-volume = { path = "crates/dc-volume" }
dc-platform = { path = "crates/dc-platform" }
aes = "0.8"
xts-mode = "0.5"
argon2 = "0.5"
blake3 = "1.5"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
blake2 = "0.10"
whirlpool = "0.10"
streebog = "0.10"
kuznyechik = "0.8"
twofish = "0.7"
camellia = "0.1"
fuser = "0.18"
ripemd = "0.1"
crc32fast = "1.4"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_core = "0.6"
getrandom = "0.2"
ml-kem = { version = "0.2", features = ["deterministic"] }
hkdf = "0.12"
hex = "0.4"
tempfile = "3.14"
rpassword = "7.3"
