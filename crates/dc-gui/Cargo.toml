[package]
name = "dc-gui"
description = "DeviceCryptor iced GUI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "devicecryptor"
path = "src/main.rs"

[dependencies]
dc-volume = { workspace = true }
dc-format = { workspace = true }
dc-platform = { workspace = true }
dc-crypto = { workspace = true }
iced = { version = "0.13", default-features = true, features = ["tokio"] }
rfd = "0.15"
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
