name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: build
        run: cargo build -p dc-crypto -p dc-format -p dc-volume -p dc-platform -p dc-cli
      - name: test
        run: cargo test -p dc-crypto -p dc-format -p dc-volume -p dc-platform -p dc-cli -- --test-threads=1
      - name: clippy
        run: cargo clippy -p dc-crypto -p dc-format -p dc-volume -p dc-platform -p dc-cli -- -D warnings
      - name: linux e2e
        run: ./scripts/linux-test.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  fuzz:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - name: clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: sector_xts
        run: cargo +nightly fuzz run sector_xts -- -runs=10000
      - name: header_payload
        run: cargo +nightly fuzz run header_payload -- -runs=10000

  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: same-toolchain dc hash
        run: ./scripts/release-linux.sh repro
