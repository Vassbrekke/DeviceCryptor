[package]
name = "iced_glyphon"
description = "Fast, simple 2D text rendering for wgpu"
version = "0.6.0"
edition = "2021"
homepage = "https://github.com/hecrj/glyphon.git"
repository = "https://github.com/hecrj/glyphon"
license = "MIT OR Apache-2.0 OR Zlib"
publish = false

# Patched copy of crates.io iced_glyphon 0.6.0 (git 647575039c86faf21518c3064f9dde2dacf16db7).
# The only change is lru: 0.12.1 pulled a vulnerable release (RUSTSEC IterMut / GHSA, fixed in 0.16.3).
# Call sites use put, peek, peek_lru, pop_lru, and promote, which 0.16 still provides.

[dependencies]
wgpu = { version = "0.19", default-features = false, features = ["wgsl"] }
etagere = "0.2.10"
cosmic-text = "0.12"
lru = { version = "0.16.4", default-features = false }
rustc-hash = "2.0"
